name: Verify Mintform

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run test:types
      - run: npm run build:demo

  package-managers:
    name: npm, pnpm, Yarn PnP, and Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm run test:consumer
