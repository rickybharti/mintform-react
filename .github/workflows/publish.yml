name: Publish Mintform

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'rickybharti/mintform-react'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: corepack enable
      - run: npm ci
      - name: Verify release tag
        run: node -e 'const { version } = require("./package.json"); const expected = `v${version}`; if (process.env.GITHUB_REF_NAME !== expected) throw new Error(`Expected tag ${expected}, received ${process.env.GITHUB_REF_NAME}`);'
      - run: npm run test:release
      - run: npm publish
